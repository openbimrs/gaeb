[package]
name = "openbim-gaeb-bindings"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/gaeb"
description = "Opt-in generated typed bindings for fixture-proven GAEB DA XML profiles."
keywords = ["gaeb", "bim", "openbim", "xml"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
openbim-gaeb = { version = "0.1.3", path = "../openbim-gaeb" }
quick-xml = "0.38"
rust_decimal = { version = "1.42", default-features = false }
thiserror = "2.0.20"
xsd-parser-types = { version = "=0.2.1", features = ["quick-xml"] }
