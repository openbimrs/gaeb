[package]
name = "openbim-gaeb"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/gaeb"
readme = "README.md"
description = "Pure-Rust GAEB DA XML reading, inspection, and lossless editing."
keywords = ["gaeb", "bim", "openbim", "construction", "xml"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "build.rs", "support-matrix.csv", "schema-support-matrix.json", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
iri-string = { version = "0.7", default-features = false }
num-bigint = "0.4"
quick-xml = "0.37"
thiserror = "2.0.20"
roxmltree = "0.20"
tempfile = "3.10"
xsd-schema = { git = "https://github.com/GeneralPawz/xsd-schema.git", rev = "53de66ccb075246a67e5986742cdcdb5deb81267", version = "0.1.4" }

[dev-dependencies]
serde_json = "1"
