[package]
name = "openbim-gaeb"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/gaeb"
readme = "README.md"
description = "Pure-Rust GAEB DA XML reading, inspection, and lossless editing."
keywords = ["gaeb", "bim", "openbim", "construction", "xml"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
quick-xml = "0.37"
thiserror = "2"
